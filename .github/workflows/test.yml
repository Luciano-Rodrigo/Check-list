name: Tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: luma_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: luma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luma_test -d luma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Memory and production configuration tests
        run: npm test
      - name: PostgreSQL integration and restart persistence
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://luma_test:local-ci-only@127.0.0.1:5432/luma_test
          TEST_PGSSLMODE: disable
